[package]
name = "pocket-atlas-psp"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
pocket-psp-ge = { path = "../vendor/pocketjs/devices/psp/pocket-psp-ge" }
# The interface (ui/) runs on PocketJS's PSP host library: QuickJS, the UI
# core, its GE backend, and the one-block arena that serves them and Rust.
psp = { git = "https://github.com/pocket-nexus/rust-psp.git", rev = "2cbaf8c9bc72569c76240a1d9743de10731e5f6b", features = ["external-c-heap", "abort-only", "external-global-alloc"] }
libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b" }
pocketjs-psp = { path = "../vendor/pocketjs/hosts/psp" }
pocket-atlas-interface = { path = "../crates/pocket-atlas-interface", features = ["guest"] }
pocket3d-place-psp = { path = "../crates/pocket3d-place-psp" }
pocket3d-title = { path = "../vendor/pocketjs/engine/pocket3d/crates/pocket3d-title" }
bytemuck = "1"
glam = { version = "0.33", default-features = false, features = ["libm"] }
libm = "0.2"
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
