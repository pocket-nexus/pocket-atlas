# Pocket Atlas drawn with wgpu: in a browser tab over WebGPU (wasm32), and on
# the machine that builds it (Metal), where a frame can be written to a file.
#
# This crate is the shell of the atlas screen: the globe (src/globe.rs, the
# iPod touch's, in WGSL), the game's side of the interface channel
# (crates/pocket-atlas-interface) and the seam a place's renderer plugs into
# (src/place.rs). It draws no place. Everything that is not this game's is
# PocketJS's browser kernel (vendor/pocketjs/devices/web/pocket-web-wgpu): the
# GPU device and its screens, the interface's overlay pass, ranges of a pack.
#
#   bun tools/wgpu.ts build | serve | dist | shot | check     (from the repository root)

[package]
name = "atlas-wgpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Atlas's wgpu shell: the atlas screen's globe and the seam of a place renderer, in a browser tab and on the build machine"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "atlas-shot"
path = "src/bin/shot.rs"

[dependencies]
pocket-atlas-interface = { path = "../crates/pocket-atlas-interface" }
pocket-web-wgpu = { path = "../vendor/pocketjs/devices/web/pocket-web-wgpu" }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The command line tool that writes the JavaScript side must be this version (tools/wgpu.ts checks).
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[workspace]
resolver = "2"
