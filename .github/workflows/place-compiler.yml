name: Place compiler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo test --locked --workspace
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun test tools/psp-session.test.ts tools/atlas-3ds-delivery.test.ts tools/atlas-3ds-support.test.ts web/src/places/shared/daylight/glazing.test.ts web/src/places/sf-lombard-street/world/layout.test.ts web/src/places/sf-lombard-street/world/traffic.test.ts
      - run: bun run build
        working-directory: web
