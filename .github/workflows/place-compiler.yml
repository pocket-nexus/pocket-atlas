name: Place compiler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo test --locked --workspace
      # The browser tab's shell (wgpu/) is its own workspace: it is type-checked for the tab's target here.
      # Its tests and `bun tools/wgpu.ts check` need a GPU and Chrome, and are run on a developer's machine.
      - run: cargo check --locked --lib --target wasm32-unknown-unknown --manifest-path wgpu/Cargo.toml
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun test tools/*.test.ts web/scripts/*.test.ts web/src/places/shared/daylight/*.test.ts web/src/places/sf-lombard-street/world/*.test.ts
      # The tools take the app icon's paths from PocketJS's tools/pocket3d-icon.ts,
      # whose types reach PocketJS's rasterizer (@napi-rs/canvas): PocketJS's
      # packages are installed before the tools are type-checked.
      - run: bun install --frozen-lockfile
        working-directory: vendor/pocketjs
      - run: bun web/node_modules/typescript/bin/tsc -p tsconfig.tools.json
      # The interface (ui/) is compiled for each device and run on PocketJS's
      # wasm core, which is built here.
      - run: bun tools/wasm.ts
        working-directory: vendor/pocketjs
      - run: bun test ui/test
      - run: bun web/node_modules/typescript/bin/tsc -p ui/tsconfig.json
      - name: Shadow receiver bounds
        run: |
          mkdir -p .pocket-build/validation/ci
          rustc --edition=2021 --test vita/src/sun_bounds.rs -o .pocket-build/validation/ci/sun-bounds
          .pocket-build/validation/ci/sun-bounds
      - run: bun test test/*.test.ts
        working-directory: web
      - run: bun run build
        working-directory: web
