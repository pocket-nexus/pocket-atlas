name: Place compiler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p pocket3d-place --no-default-features
      - run: bun test tools/psp-session.test.ts tools/atlas-3ds-delivery.test.ts
      - name: Install host GLES shader tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-cross
      - run: bun test tools/atlas-ipod-*.test.ts
      - run: sh ipod/tests/scene/run.sh
      - run: sh ipod/tests/render_worker.sh
      - run: sh ipod/tests/render_pacing.sh
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
