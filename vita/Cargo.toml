[package]
name = "pocket-city-vita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket City on PS Vita: the Tokyo rain scene on the programmable GXM renderer"

# Vita-only binary built through cargo-vita (tools/city.ts); excluded from the
# desktop workspace in the repository root.
[workspace]
resolver = "2"

[dependencies]
pocketjs-vita = { path = "../vendor/pocketjs/hosts/vita", default-features = false }
pocket3d-gxm = { path = "../crates/pocket3d-gxm" }
pocket3d-city = { path = "../crates/pocket3d-city" }
glam = "0.33"
serde_json = "1"

[target.'cfg(target_os = "vita")'.dependencies]
vita2d-sys = "0.1.1"
vitasdk-sys = { version = "0.3.3", features = ["SceGxm_stub", "SceKernelThreadMgr_stub", "SceLibKernel_stub", "ScePower_stub", "SceCtrl_stub"] }

[features]
default = ["usb-debug"]
usb-debug = ["pocketjs-vita/usb-debug"]

[package.metadata.vita]
title_id = "PKCT00001"
title_name = "Pocket City"
build_std = "std,panic_abort"

[package.metadata.vita.profile.release]
strip_symbols = false
