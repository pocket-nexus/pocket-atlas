# Host-side crates: the pack format and the cooker. The Vita runtime (vita/)
# builds through cargo-vita as its own workspace. Its shared GXM mechanisms
# come from the pinned PocketJS device kernel.
[workspace]
resolver = "2"
members = ["crates/pocket-atlas-model", "crates/pocket3d-place", "crates/pocket3d-place-cook", "crates/pocket3d-place-psp"]
exclude = ["vita", "psp", "vendor"]

[profile.release]
debug = false
