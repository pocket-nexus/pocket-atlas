# Host-side crates: the pack format and the cooker. The Vita runtime (vita/)
# and its GXM layer (crates/pocket3d-gxm) build through cargo-vita as their
# own workspaces.
[workspace]
resolver = "2"
members = ["crates/pocket3d-place", "crates/pocket3d-place-cook", "crates/pocket3d-place-psp"]
exclude = ["crates/pocket3d-gxm", "vita", "psp", "vendor"]

[profile.release]
debug = false
