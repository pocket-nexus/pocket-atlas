[package]
name = "pocket3d-place-cook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cooks glTF 2.0 places with extras.pocketAtlas into Pocket Atlas place packs"

[[bin]]
name = "pocket-atlas-cook"
path = "src/main.rs"

[dependencies]
pocket3d-place = { path = "../pocket3d-place" }
pocket3d-place-psp = { path = "../pocket3d-place-psp" }
bytemuck = "1"
gltf = { version = "1.4", features = ["KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_unlit", "KHR_materials_emissive_strength", "extras", "extensions", "names", "utils", "import", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
texpresso = { version = "2", features = ["rayon"] }
rayon = "1"
glam = "0.33"
half = "2"
serde_json = "1"
meshopt = "0.6"
ab_glyph = "0.2"
