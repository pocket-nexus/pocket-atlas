[package]
name = "pocket-atlas-interface"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The renderer's side of the Pocket Atlas interface protocol, for the Rust renderers"

[dependencies]
# The guest's service ops, answered in the process: only on a device.
libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b", optional = true }

[features]
guest = ["dep:libquickjs-sys"]
