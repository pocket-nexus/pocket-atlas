[package]
name = "pocket3d-city-cook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cooks glTF 2.0 city scenes with extras.pocketCity into Pocket City packs"

[[bin]]
name = "pocket-city-cook"
path = "src/main.rs"

[dependencies]
pocket3d-city = { path = "../pocket3d-city" }
gltf = { version = "1.4", features = ["KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_unlit", "KHR_materials_emissive_strength", "extras", "extensions", "names", "utils", "import", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
texpresso = { version = "2", features = ["rayon"] }
rayon = "1"
glam = "0.33"
half = "2"
serde_json = "1"
meshopt = "0.6"
