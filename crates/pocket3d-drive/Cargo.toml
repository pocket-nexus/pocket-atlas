[package]
name = "pocket3d-drive"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portable snow-driving domain simulation and replay oracle for Pocket Atlas"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "drive-oracle"
path = "src/bin/oracle.rs"
